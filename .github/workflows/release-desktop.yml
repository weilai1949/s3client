# 打 tag（v*）或手动指定 tag 时，交叉打包桌面安装包并挂到 GitHub Release。
# 产物：Windows NSIS (.exe)、Linux .deb、macOS .dmg（未公证，用户需自行允许打开）。
name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有 tag（如 v1.0.0-rc0），用于补打安装包并挂到 Release'
        required: true
        type: string

concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # 供应链证明（P0）：Sigstore 走 OIDC 短期令牌，无需长期签名密钥；
  # attestations: write 把证明写入仓库 attestations API，消费者用
  # `gh attestation verify <file> --repo <owner>/<repo>` 核验。
  # 这是「代码签名证书未到位」（roadmap E6）之外的**独立**一层完整性保证：
  # 它证明「产物由本仓库的哪个 commit / 哪个 workflow 构建」，但不解决
  # SmartScreen / Gatekeeper 的**发布者信誉**问题——两者不可互相替代。
  id-token: write
  attestations: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (nsis / exe)
            platform: windows-latest
            bundles: nsis
          - name: Linux (deb)
            platform: ubuntu-22.04
            bundles: deb
          - name: macOS (dmg)
            platform: macos-latest
            bundles: dmg

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "tag must start with v, got: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-rc"* || "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Verify tag matches manifest versions
        # R2：此前解析出 tag 后**从不**与 tauri.conf.json / Cargo.toml 比对，因此给
        # v1.0.0-rc2 打 tag 会发布**标着 rc1** 的安装包。这里强制三处一致（tag 去掉前缀 v）。
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          tauri=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          cargo=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$TAG want=$want tauri=$tauri cargo=$cargo"
          fail=0
          [ "$tauri" = "$want" ] || { echo "::error::tauri.conf.json version=$tauri != tag $want"; fail=1; }
          [ "$cargo" = "$want" ] || { echo "::error::Cargo.toml version=$cargo != tag $want"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      - name: System deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install web
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install desktop
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build & upload to GitHub Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: s3client ${{ steps.meta.outputs.tag }}
          releaseBody: |
            Desktop installers for **${{ steps.meta.outputs.tag }}**.

            | Platform | Artifact |
            |----------|----------|
            | Windows | NSIS installer (`.exe`) |
            | Linux | Debian package (`.deb`) |
            | macOS | Disk image (`.dmg`, unsigned) |

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/CHANGELOG.md) for release notes.
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          uploadUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}

      - name: Generate SHA256SUMS and upload
        # R3：此前三平台矩阵各自 `gh release upload SHA256SUMS.txt --clobber` **同一资产名**，
        # 并行执行下「最后写入者胜」，发布出去的校验清单只覆盖一个平台。现改为平台内唯一命名
        # （SHA256SUMS-<platform>.txt），由下方 aggregate job 合并成唯一的 SHA256SUMS.txt。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri/target/release/bundle
          files=$(find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' -o -name '*.msi' -o -name '*.rpm' -o -name '*.AppImage' \) | sed 's|^\./||')
          if [ -z "$files" ]; then
            echo "no bundle artifacts found" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          sha256sum $files > SHA256SUMS.txt
          asset="SHA256SUMS-${{ matrix.bundles }}.txt"
          cp SHA256SUMS.txt "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber

      - name: Attest bundle provenance
        # 对**本平台**的安装包做 GitHub 产物证明。SHA256SUMS 只能证明「文件没被改动」，
        # 前提是你能先拿到可信的清单；产物证明把「这个文件 ← 这个 commit ← 这个 workflow」
        # 这条链条也钉住，两者互补。
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.msi

  sbom-desktop:
    # P0 供应链（roadmap §三 #12 的剩余项之一）：桌面安装包此前**没有 SBOM**——只有容器镜像有。
    # 安装包实际装载两类依赖，本 job 一并覆盖，产出**单个** CycloneDX 文件：
    #   1. Tauri 的 Rust 二进制 ← `apps/desktop/src-tauri/Cargo.lock`（实测 429 个 crate，全部编译进二进制）
    #   2. 内嵌的 Web 资源 ← `apps/web/pnpm-lock.yaml`（实测 24 个**运行期**包；
    #      Trivy 的 pnpm 解析器只取运行期图、自动排除 devDependencies——这正是「随包分发」的口径）
    # 两份锁文件放进同一目录做一次扫描即得合并组件清单（Trivy 按文件名识别 lockfile 类型），
    # 因此**不需要**三平台各跑一遍：锁文件与平台无关。
    #
    # 复用镜像 SBOM 已 pin 的 Trivy（tag + digest 双 pin）——**不引入第二套 SBOM 工具**：
    # 多一套工具就多一条供应链，且会与 Trivy 的漏洞库读数分叉（沿用 ci.yml 的既定理由）。
    name: Desktop SBOM (CycloneDX)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Generate desktop SBOM (CycloneDX)
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR" sbomroot
          cp apps/desktop/src-tauri/Cargo.lock sbomroot/Cargo.lock
          cp apps/web/pnpm-lock.yaml sbomroot/pnpm-lock.yaml
          docker run --rm \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            -v "${{ github.workspace }}:/out" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs \
            --format cyclonedx \
            --output /out/sbom-desktop.cdx.json \
            --no-progress \
            --pkg-types os,library \
            --scanners vuln \
            /out/sbomroot
          # 自检（防空跑）：格式或解析口径变化时不得静默产出空 SBOM 还照样发布。
          # 期望量级：Cargo 429 + pnpm 24 个组件，门槛取 100 留足余量又不至于放过空文件。
          count=$(jq '[.components[]?] | length' sbom-desktop.cdx.json)
          echo "SBOM components: $count"
          [ "$count" -ge 100 ] || { echo "SBOM 组件数异常（$count < 100）：解析口径或格式需同步" >&2; exit 1; }

      - name: Attest SBOM
        # 与安装包同一层证明：把 SBOM 文件也绑定到「哪个 commit / 哪个 workflow 产出」。
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: sbom-desktop.cdx.json

      - name: Upload SBOM to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" sbom-desktop.cdx.json --clobber

  aggregate-checksums:
    # R3：等三平台全部上传完，把各自的 SHA256SUMS-<bundle>.txt 合并为唯一的 SHA256SUMS.txt，
    # 使校验清单覆盖**全部**平台产物（此前并行 clobber 只会留下一个平台）。
    name: Aggregate SHA256SUMS
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge per-platform checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p sums && cd sums
          # 拉取三平台各自的清单（缺一即失败，避免发布不完整清单）。
          for b in nsis deb dmg; do
            gh release download "$RELEASE_TAG" --pattern "SHA256SUMS-$b.txt" --clobber
          done
          # 合并 + 去重 + 按文件名排序，输出唯一 SHA256SUMS.txt。
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          lines=$(wc -l < SHA256SUMS.txt)
          echo "merged $lines checksum lines"
          # 自检：每个平台清单的行数之和必须等于合并结果（防止 pattern 漏拉）。
          total=$(cat SHA256SUMS-*.txt | wc -l)
          [ "$lines" -eq "$total" ] || { echo "checksum line count mismatch" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
          # 清理平台内中间资产，Release 只保留唯一 SHA256SUMS.txt。
          for b in nsis deb dmg; do
            gh release delete-asset "$RELEASE_TAG" "SHA256SUMS-$b.txt" --yes || true
          done

      # cosign 无密钥签名（P0 供应链，roadmap §三 #12 的 cosign 部分）。
      #
      # 为什么签**清单**而不是逐个安装包：SHA256SUMS.txt 已覆盖三平台全部产物，
      # 对它签一次即传递性地覆盖所有安装包，Release 资产只多两个文件（`.sig` / `.pem`），
      # 而逐包签会在每个平台上各产出一对签名文件、资产数随平台数膨胀。
      #
      # keyless：身份取自本 job 的 GitHub OIDC 令牌，证书与签名进 Sigstore 透明日志（Rekor），
      # 无长期私钥。核验（把 <owner>/<repo> 换成本仓库）：
      #   cosign verify-blob \
      #     --certificate SHA256SUMS.txt.pem --signature SHA256SUMS.txt.sig \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/.github/workflows/release-desktop.yml@' \
      #     SHA256SUMS.txt
      # ⚠️ 与 `actions/attest-build-provenance` 一样，它证明「产物由本仓库的哪个 commit / workflow
      # 构建」，**不解决** SmartScreen / Gatekeeper 的发布者信誉（仍需 E6 的代码签名证书）。
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksum manifest (cosign keyless)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cd sums
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" \
            SHA256SUMS.txt.sig SHA256SUMS.txt.pem --clobber
