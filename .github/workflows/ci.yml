name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Go 后端（gofmt / vet / race / cover / build）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: apps/server/go.sum

      - name: gofmt
        working-directory: apps/server
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Vet
        working-directory: apps/server
        run: go vet ./...

      # stdlib 漏洞门禁：Trivy 只扫容器 OS/库，拦不住 Go 标准库 CVE
      # （如 go1.26.5 的 6 个可达 stdlib 漏洞，go1.26.6 修复）。
      # govulncheck 基于调用链分析，仅对「代码确实可达」的漏洞失败，
      # 因此可作硬门禁；版本固定以复现构建。
      - name: govulncheck（可达漏洞门禁）
        working-directory: apps/server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2
          working-directory: apps/server
          args: --timeout=5m

      - name: Test (race + cover)
        working-directory: apps/server
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          # 覆盖率 100% 门禁（与前端同级）：直接检查 profile 里是否存在 count==0
          # 的语句块，而不是比较 total 百分比——后者只有 1 位小数，99.96% 会被
          # 四舍五入显示成 100.0% 而漏过回退。
          awk 'NR > 1 && $NF == 0 { print "uncovered block: " $0; bad = 1 } END { if (bad) exit 1 }' coverage.out

      - name: Build
        working-directory: apps/server
        run: go build -ldflags="-X main.version=ci" -o /dev/null .

  web:
    name: Web 前端（typecheck / test / build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck

      # E2E 源码（e2e/ 与 e2e-real/）不在主 tsconfig 的 include 内，此前零静态检查；
      # 单独一份 tsconfig.e2e.json 把它们纳入 vue-tsc（#37 联调用例的类型安全）。
      - name: Typecheck E2E sources
        working-directory: apps/web
        run: pnpm typecheck:e2e

      # 覆盖率 100% 门禁：阈值在 apps/web/vite.config.ts 中配置（istanbul，statements/functions/branches/lines 均为 100%），
      # 低于 100% 时 pnpm test:coverage 以非零码退出，作为覆盖率回归守卫。
      - name: Test + coverage (100% gate)
        working-directory: apps/web
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 7
          include-hidden-files: false

      - name: Build
        working-directory: apps/web
        run: pnpm build

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          # 本 job 只构建 + load 供 Trivy 扫描，不推送（推送由下方 publish job 在扫描通过后做，
          # 因为 buildx 的 push 与 load 互斥，且不能把未扫描的镜像推出去）。
          push: false
          # R9：显式注入 VERSION。此前不传 build-arg，镜像里的版本回落到 Dockerfile 的过期
          # 字面量（v1.0.0-rc1），而 GitLab 传 VERSION=ci、Makefile 传真实版本——同一个
          # Dockerfile 三种行为。现在三处都显式注入，行为一致。
          build-args: |
            VERSION=ci
          # 必须 load：setup-buildx-action 默认 driver=docker-container，镜像只留在 builder
          # 缓存里；Trivy 通过 docker.sock 扫的是**本地 daemon**，不 load 就永远找不到该镜像
          # （表现为 Trivy 报错，而不是扫出漏洞）。GitLab 侧用原生 docker build，故无此问题。
          load: true
          tags: s3clinet/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image is loadable by Trivy
        # 把「镜像没进本地 daemon」这一结构性失败与「真的扫出漏洞」区分开：
        # 先显式 inspect，失败信息才指向构建/load 而不是安全问题。
        run: docker image inspect s3clinet/server:ci > /dev/null

      - name: Cache Trivy DB
        # R4：Trivy 漏洞库此前每次 job 都从 mirror.gcr.io 现拉，仓库自带日志记录过
        # `FATAL … connection timed out`（6m44s 后失败），且无缓存、无重试。
        # 缓存 DB 目录可让命中时免下载；未命中时由下方「预下载」带重试补齐。
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.trivy-cache
          key: trivy-db-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy image scan (CRITICAL/HIGH 失败门禁)
        # 直接使用 Trivy 官方镜像避免第三方 action 供应链风险；
        # 注意 Docker Hub 上的仓库名是 aquasec/trivy（aquasecurity/trivy 只存在于
        # ghcr.io，写成后者会因拉不到镜像而以 exit 125 失败——不是扫出了漏洞）。
        # 扫描本地刚构建的镜像（未 push），fail on CRITICAL/HIGH。
        # 范围：只扫 OS 与库（不扫语言包，alpine musl 无此问题）；
        # 只关注已发布修复的漏洞（--ignore-unfixed）；
        # .trivyignore 集中收纳极少数确认可忽略的 CVE。
        #
        # R4：DB 下载拆成独立步骤并带指数退避重试；扫描阶段 --skip-db-update 复用已就绪的
        # DB，从而把「网络抖动」与「真的扫出漏洞」区分开（此前网络失败会表现为 job 红）。
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          ok=0
          for attempt in 1 2 3 4; do
            if docker run --rm \
                 -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
                 aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
                 --download-db-only --no-progress; then
              ok=1
              break
            fi
            echo "Trivy DB download attempt $attempt failed; retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          if [ "$ok" -ne 1 ]; then
            echo "Trivy DB download failed after 4 attempts" >&2
            exit 1
          fi

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            -v "${{ github.workspace }}/.trivyignore:/trivy/.trivyignore:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --severity CRITICAL,HIGH \
            --pkg-types os,library \
            --exit-code 1 \
            --no-progress \
            --ignore-unfixed \
            --skip-db-update \
            --ignorefile /trivy/.trivyignore \
            s3clinet/server:ci

  # R10：镜像发布。此前没有任何 workflow 推送镜像（docker job 恒 push:false），
  # 「发布」只有 tag + 桌面安装包，用户无法 docker pull 到 CI 构建的产物。
  # 设计取舍：独立 job 且 needs: docker —— 只有镜像构建成功且 Trivy 扫描通过才推送，
  # 避免把带 CRITICAL/HIGH 漏洞的镜像推上 registry。PR 一律不推（只在 main/develop 推送）。
  publish:
    name: 推送镜像到 GHCR
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          # R9：与 docker job 用同一个 build-arg，保证「扫描的镜像」与「推送的镜像」版本一致。
          build-args: |
            VERSION=ci
          # 按 commit SHA 与分支双标签：SHA 可精确回滚，分支标签便于 follow。
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ github.sha }}
            ghcr.io/${{ github.repository }}/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop（cargo check）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - name: System deps (webkit/gtk for tauri/wry)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Placeholder frontendDist for tauri generate_context
        run: |
          mkdir -p apps/web/dist
          printf '%s\n' '<!doctype html><title>ci</title>' > apps/web/dist/index.html
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      # RustSec 审计：有已知漏洞即红灯；unmaintained/unsound 告警按
      # docs/threat-model.md §5 逐条 triage（当前 7 条，均无 upstream 修复版本）。
      - name: cargo audit (RustSec)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  # 完整 Tauri 链接较重（webkit 依赖 + 前端 build），仅手动触发，不阻塞 PR。
  desktop-build:
    name: Desktop（tauri build --no-bundle）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build web
        working-directory: apps/web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install tauri-cli (cached across runs)
        working-directory: apps/desktop
        run: cargo install tauri-cli --version "^2" --locked
      - name: tauri build --no-bundle
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          cd src-tauri && cargo tauri build --no-bundle
