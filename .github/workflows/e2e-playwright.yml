name: E2E (Playwright)

# 浏览器侧端到端：起 vite preview + Playwright chromium 跑核心流程。
# 完整 S3 链路由 server/internal/s3wrap/e2e_test.go 在 RustFS 真对端覆盖（e2e.yml），
# 此处聚焦「前端构建产物能在真实浏览器加载 + 关键交互链路通畅」。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'server/internal/handler/**'
      - '.github/workflows/e2e-playwright.yml'
  schedule:
    # 每周三 02:00 UTC 冒烟
    - cron: '0 2 * * 3'

concurrency:
  group: e2e-pw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-e2e:
    name: Playwright 浏览器侧 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_NO_WEBSERVER: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0d3e1d3ed4c0f0 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web (vite)
        working-directory: web
        run: pnpm build

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install chromium --with-deps

      - name: Start vite preview
        working-directory: web
        run: |
          pnpm preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 2
          done
          echo "vite preview not ready" >&2
          exit 1

      - name: Run Playwright tests
        working-directory: web
        run: pnpm e2e:ci

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d45b6c00b04997f9f0f6da4b11e28e695 # v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
