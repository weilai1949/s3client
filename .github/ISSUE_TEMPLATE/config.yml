# Issue 模板选择页配置（GitHub 的 template chooser）。
# contact_links 会显示在「新建 issue」模板选择页的底部，用于把贡献者引导到
# 不该开 issue 的渠道（贡献指南 / 安全漏洞私密报告）。
# 参考：https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

# 隐藏「空白 issue」（Write 及以上权限的维护者仍会看到 Maintainers only 的入口）。
blank_issues_enabled: false

contact_links:
  - name: 贡献指南（分支 / 提交规范 / 开发环境）
    url: https://github.com/weilai1949/s3clinet/contribute
    about: 开 issue 或 PR 前请先读这里；改动需要同步哪些文档见 docs/development.md §4「文档同步门禁」。
  - name: 报告安全漏洞（请勿公开）
    url: https://github.com/weilai1949/s3clinet/security/advisories/new
    about: 安全问题请走私密渠道，不要开 public issue；报告需包含的内容见 .github/SECURITY.md。
