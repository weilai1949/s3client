# golangci-lint v2（配合 Go 1.26+）
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - gosec
    # nolintlint：AGENTS.md / development.md 明令禁止用 `//nolint` 消音（「那只是把死代码藏起来」）。
    # 但此前没有任何门禁拦截它——实测在函数上方加一行无理由的 `//nolint:all`，`golangci-lint run`
    # 仍报 0 issues（`//nolint` 是 golangci 自身的指令，默认不受任何 linter 审查）。
    # 启用后：必须写明具体 linter、必须给出理由，且不得写 `//nolint:all`。
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    gosec:
      excludes:
        - G104 # handler 流式路径常见的审计忽略
        - G109 # maxKeys 等已钳制到 <=1000 再转 int32
        - G117 # Account JSON 含 accessKey/secretKey 字段名属预期（落盘加密/权限由 store 保证）
        - G304 # 数据目录/临时文件路径由服务端配置与代码构造，非用户任意路径
        - G704 # S3 HTTP 客户端已在 Dial/CheckRedirect 层做 SSRF 拦截
    errcheck:
      exclude-functions:
        - io.Copy
        - (*bufio.Writer).Flush
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
