# Rust 工具链 pin（#33）：本地 rustup 与 CI（dtolnay/rust-toolchain@1.98.1）必须装同一个版本，
# 否则「本地 cargo check 绿 / CI 红」会因 rustc 版本差异反复出现。
#
# 位置说明：本目录是 crate 根（含 Cargo.toml），仓库内不存在 workspace 根，故 rust-toolchain.toml
# 放在此处即被 Cargo/rustup 生效（rustup 从当前目录向上查找最近的该文件）。
#
# 版本来源：https://static.rust-lang.org/dist/channel-rust-stable.toml
#   version = "1.98.1 (48a229cea 2026-09-01)"
# 不声明 components：仓库未使用 cargo fmt / cargo clippy，且 CI 以 --profile minimal 安装，
# 额外组件只会拖慢构建。
# 升级时须同步 .github/workflows/ci.yml、release-desktop.yml 的 dtolnay/rust-toolchain pin 与
# .gitlab-ci.yml 的 rust 镜像 tag；回归门禁见 apps/server/repo_infra_gate_test.go。
[toolchain]
channel = "1.98.1"
