[package]
name = "s3client"
version = "1.0.0"
description = "S3 v4 signed client desktop shell (B/S, no IPC)"
authors = ["weilai1949"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# 用于打包发布（custom protocol serve bundled assets）
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
codegen-units = 1    # 让 LLVM 拿到更大优化单元
lto = true           # 链接期优化
opt-level = "s"      # 体积优先（要速度改回 3）
panic = "abort"      # 本壳无 catch_unwind 依赖
strip = true         # 去掉发布产物调试符号
