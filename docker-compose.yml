services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        # 国内网络可覆盖：GOPROXY=https://goproxy.io,direct  NPM_REGISTRY=https://registry.npmmirror.com
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: s3client/server:v1.0.0
    container_name: s3client-server
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # 安全默认：不直接暴露端口；经 nginx（worker_processes=1）统一入口 :5000
    expose:
      - "5000"
    # 让后端容器能按服务名访问 rustfs（server 侧：列表/签名/复制/迁移/删除）。
    # 注意：前端“直传”用预签名 URL，其 S3 端点必须能被【浏览器】解析。
    # 若连宿主机浏览器都用，请把账号端点配成浏览器可达地址（如宿主发布的
    # http://127.0.0.1:9000），并让 server 也能找到它——最简单是给 server 加
    # `network_mode: host`（Linux）。本 compose 默认用服务名 rustfs:9000，
    # 仅验证 server↔rustfs 服务端链路；浏览器直传请按实际 S3 端点配置。
    # 安全默认：仅回环发布；需要远程访问时改为 "5000:5000" 并务必设置 S3C_TOKEN。
    # 直连调试（绕过 nginx）：取消下行注释
    # ports:
    #   - "127.0.0.1:5001:5000"
    environment:
      S3C_ADDR: "0.0.0.0:5000"
      S3C_SHUTDOWN_TIMEOUT: "${S3C_SHUTDOWN_TIMEOUT:-30}"
      S3C_RATE_LIMIT_RPM: "${S3C_RATE_LIMIT_RPM:-120}"
      S3C_RATE_LIMIT_BURST: "${S3C_RATE_LIMIT_BURST:-30}"
      S3C_EXPOSE_METRICS: "${S3C_EXPOSE_METRICS:-0}"
      S3C_METRICS_TOKEN: "${S3C_METRICS_TOKEN:-}"
      S3C_DATA_DIR: "/data"
      # 生产推荐 encrypted（整文件加密，需 store key）。默认 sqlite：
      # 只要提供了 store key，secret_key 列即以 AES-256-GCM 密文落盘（已闭环：见 docs/FEATURES.md §M；残留风险 docs/ROADMAP.md §5.1「已收敛」索引 R3）。
      # 安全默认（P-8）：store key / API token **不再经 environment 明文注入**——`environment:`
      # 会被 `docker inspect` / `/proc/<pid>/environ` 读到。改由下方 `secrets:` 以文件挂载，
      # 服务端从 `S3C_STORE_KEY_FILE` / `S3C_TOKEN_FILE` 读取（内容去首尾空白；文件不可读/为空 →
      # 启动 fail-closed）。生成命令与属主要求见 docs/DEPLOYMENT.md「docker secrets 迁移」；
      # secret 文件缺失时 `docker compose up` 直接失败（compose 不会创建不存在的 bind），
      # 因此不存在「静默以明文/无 key 上线」的路径。
      # 仅本地联调确需明文时：在本 environment: 白名单里补
      # `S3C_ALLOW_PLAINTEXT_STORE: "1"`（compose 只透传白名单内的变量，写进 .env 无效）；
      # 服务端会在启动日志打出「明文落盘」WARN。生产绝不要这么做。
      S3C_STORE_DRIVER: "${S3C_STORE_DRIVER:-sqlite}"
      S3C_STATIC_DIR: "/web/dist"
      S3C_REGION: "${S3C_REGION:-us-east-1}"
      # 非回环监听强制鉴权：token 经 secrets 文件注入（缺文件/空文件 → 启动 fail-closed）
      S3C_STORE_KEY_FILE: "/run/secrets/store_key"
      S3C_TOKEN_FILE: "/run/secrets/api_token"
      # 从外部访问需跨域时填写（留空 = 仅 localhost/tauri）
      S3C_CORS_ORIGINS: "${S3C_CORS_ORIGINS:-}"
      S3C_LOG_LEVEL: "${S3C_LOG_LEVEL:-info}"
      # 结构化日志：容器场景默认开启，便于日志采集器按字段检索（KNOWN_ISSUES #21）。
      # 设为 0 可退回纯文本（本地人工阅读更方便）。
      S3C_LOG_JSON: "${S3C_LOG_JSON:-1}"
    volumes:
      - s3c-data:/data
    # P-8：密钥以文件挂载（/run/secrets/<name>），不再进 environment。
    secrets:
      - store_key
      - api_token
    depends_on:
      rustfs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 2026-10-16：512M → 1G——未知大小流式复制段长 64MiB → 105MiB 后，
          # 最坏在飞 4 路 × 105MiB = 420MiB + 基线（内存账见 ADR-014 Update）。
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # P-14 容器加固：只读根文件系统 + 禁提权 + 丢弃全部 capability。
    # 退出码/健康检查/卷不受影响：/data 是 named volume（read_only 下仍可写）；
    # /tmp 用 tmpfs 提供可写临时目录（重启即失，符合临时文件语义）。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    # P-4：上游 nginx alpine 镜像（实测 1.30.6 / stable / mainline 都一样）仍 ship
    # zlib-1.3.2-r0 ← CVE-2026-85091（HIGH），而 Alpine 3.24 分支已有修复版 1.3.2-r1。
    # 结构性解法与 server 运行阶段一致：pin 上游 stable 基座 digest（不可变）+ 构建期
    # `apk upgrade`。基座 = nginx 1.30.6 stable / Alpine 3.24.2（支持至 2028-06-01）。
    # 两个 compose 的 nginx 必须同 dockerfile + 同 image
    # （门禁 TestNginxEdgeImageIsConsistentAcrossCompose）；基座 digest 单独 pin 在
    # deploy/nginx/Dockerfile（门禁 TestNginxEdgeDockerfilePinsBaseAndAppliesPatches）。
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: s3client/nginx:1.30.6-alpine
    container_name: s3client-nginx
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./deploy/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/s3client-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    # nginx 只做单 worker 反向代理/静态托管，128M 足够；与 server/rustfs 一样显式限内存，
    # 避免代理层异常时无界占用宿主机内存。
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # P-14 容器加固：nginx master 需要 CAP_CHOWN/SETGID/SETUID 才能把 worker 降权并 chown
    # /var/cache/nginx 下的临时目录；其余 capability 全丢。实测：只 cap_drop: [ALL] 时 nginx 以
    # `chown("/var/cache/nginx/client_temp", 101) failed (1: Operation not permitted)` 退出。
    # tmpfs 只需 /var/cache/nginx（临时目录）与 /run（/var/run/nginx.pid）；**不要**给
    # /var/log/nginx 挂 tmpfs——官方镜像里 access.log/error.log 是指向 /dev/stdout、/dev/stderr
    # 的符号链接，挂 tmpfs 会把日志从 json-file 采集里丢掉。
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /run:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  rustfs:
    # pin 版本避免 latest 漂移导致 E2E flaky
    image: rustfs/rustfs:1.0.0-rc.3@sha256:800cf3f352a0a27e3275ca854a51f0027975d7acc7a0d52089a35bcc9fcbf0b5
    container_name: s3client-rustfs
    restart: unless-stopped
    ports:
      # 安全默认：仅回环发布（RustFS 控制台 / S3 API）。
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}"
      RUSTFS_CORS_ALLOWED_ORIGINS: "${RUSTFS_CORS_ORIGINS:-http://127.0.0.1:5000,http://localhost:5000}"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "${RUSTFS_CORS_ORIGINS:-http://127.0.0.1:5000,http://localhost:5000}"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    healthcheck:
      # 不依赖镜像内 curl：用 BusyBox/wget 或纯 TCP 探测
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health 2>/dev/null || curl -sf http://127.0.0.1:9000/health 2>/dev/null || (exec 3<>/dev/tcp/127.0.0.1/9000)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  s3c-data:
  rustfs-data:

# P-8：凭据文件（不入库，见 .gitignore）。生成与属主要求见 docs/DEPLOYMENT.md。
# compose 的文件型 secret 按宿主机属主/权限原样 bind-mount，server 容器以 uid 1000 读取，
# 故生成后需 `chmod 600` 且保证 uid 1000 可读（`chown 1000:1000` 或 root:1000 + 640）。
secrets:
  store_key:
    file: ./secrets/store_key
  api_token:
    file: ./secrets/api_token
