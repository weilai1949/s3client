# TLS 终止示例（自签或 Let's Encrypt 证书）。
# 用法：复制为 conf.d/s3clinet-tls.conf，挂载证书后 reload nginx。
#
# docker-compose.prod.yml 可增加：
#   volumes:
#     - ./deploy/nginx/conf.d/s3clinet-tls.conf:/etc/nginx/conf.d/default.conf:ro
#     - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
#     - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
#   ports:
#     - "443:443"

upstream s3clinet_backend {
    server server:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全响应头（todolist #18 / ASSESSMENT M6）：
    #   HSTS 仅在 TLS 站点有意义——告知浏览器后续强制走 https，抵御降级与
    #   cookie 劫持。先给 180 天且不带 preload，确认无子域兼容问题后再按需加长。
    #   Permissions-Policy 关闭本应用不需要的浏览器特性（定位/麦克风/摄像头等），
    #   缩小被注入脚本滥用的能力面。后端已设 CSP/X-Frame-Options 等，此处补齐
    #   「只能由 TLS 终止层表达」的两项。
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

    client_max_body_size 5g;

    location / {
        proxy_pass http://s3clinet_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}
