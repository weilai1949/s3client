# Docker 专用主配置：worker_processes=1，upstream 在 conf.d/s3client-docker.conf
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志带上请求 ID，用于「用户报错 → 查 nginx 日志 → 定位后端 req」的跨层关联。
    # 两个变量都要记（KNOWN_ISSUES #68）：
    #   - $upstream_http_x_request_id：后端在**每个响应**上回显的 ID（客户端没传时由后端生成），
    #     与后端访问日志的 `req` 字段同源——这才是用来对齐的值；
    #   - $http_x_request_id：客户端**请求**里带的值（用户从报错提示抄下来的通常是它）。
    # 只记后者会在「客户端没传」时记成空——而那正是最常见的场景（浏览器不会自己加这个头）。
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid=$http_x_request_id req=$upstream_http_x_request_id';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
